<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>המעבדה של פיקאצ'ו</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Arial Rounded MT Bold", "Varela Round", Arial, sans-serif; background: #fff8dc; touch-action: none; }
  button { font-family: inherit; font-weight: bold; cursor: pointer; border: none; }
  .top { position: fixed; top: 0; left: 0; right: 0; height: 74px; display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; z-index: 20; }
  .round { width: 58px; height: 58px; border-radius: 50%; font-size: 28px; background: #fff; border: 4px solid #3b4cca; box-shadow: 0 4px 0 #23308a; }
  .round:active { transform: translateY(3px); box-shadow: 0 1px 0 #23308a; }
  .stars { background: #fff; border: 4px solid #ffcb05; box-shadow: 0 4px 0 #c79a00; border-radius: 30px; padding: 6px 16px; font-size: 28px; color: #3b4cca; font-weight: bold; }
  .grp { display: flex; gap: 8px; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: block; }
  /* menu */
  #menu { background: radial-gradient(circle at 50% 30%, #fff59d, #ffcb05 60%, #f5a300); }
  #menu .inner { position: absolute; inset: 74px 0 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 10px; }
  h1 { margin: 0; font-size: clamp(32px, 7vw, 64px); color: #3b4cca; text-shadow: 3px 3px 0 #fff; text-align: center; }
  #menuPika { width: min(200px, 34vh); height: min(200px, 34vh); }
  .tiles { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .tile { width: clamp(120px, 28vw, 200px); height: clamp(120px, 28vw, 200px); border-radius: 30px; border: 6px solid #fff; font-size: clamp(56px, 12vw, 90px); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 8px 0 rgba(0,0,0,.25); line-height: 1.1; }
  .tile span { font-size: clamp(18px, 4vw, 28px); text-shadow: 0 2px 2px rgba(0,0,0,.4); }
  .tile:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .tile { position: relative; } .tile.done::after { content: "⭐"; position: absolute; font-size: 40px; top: -18px; right: -14px; }
  .t1 { background: #29b6f6; } .t2 { background: #66bb6a; } .t3 { background: #ef5350; }
  /* bubble */
  #guide { position: fixed; bottom: 8px; right: 8px; z-index: 15; display: flex; align-items: flex-end; gap: 6px; pointer-events: none; max-width: calc(100% - 16px); }
  #guidePika { width: 110px; height: 110px; flex: none; }
  #bubble { background: #fff; border: 4px solid #3b4cca; border-radius: 24px; padding: 10px 16px; font-size: clamp(20px, 4.5vw, 30px); color: #222; max-width: 560px; box-shadow: 0 4px 0 rgba(0,0,0,.2); margin-bottom: 40px; opacity: 0; transform: scale(.6); transition: .25s; pointer-events: auto; }
  #bubble.show { opacity: 1; transform: scale(1); }
  #menu.on ~ #guide { display: none; }
  .big { font-size: clamp(26px, 6vw, 40px); padding: 12px 28px; border-radius: 40px; color: #fff; border: 5px solid #fff; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .green { background: #43a047; } .blue { background: #1e88e5; } .red { background: #e53935; } .yellow { background: #ffb300; }
  /* sink / float */
  #sink { background: linear-gradient(#bbdefb, #e3f2fd); }
  #tray { position: absolute; top: 78px; left: 0; right: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0 8px; }
  .obj { font-size: clamp(42px, 8vw, 60px); width: clamp(62px, 11vw, 84px); height: clamp(62px, 11vw, 84px); border-radius: 20px; background: #fff; border: 4px solid #90caf9; box-shadow: 0 4px 0 #64b5f6; display: flex; align-items: center; justify-content: center; padding: 0; }
  .obj.used { opacity: .25; pointer-events: none; }
  #tank { position: absolute; left: 4%; right: 4%; bottom: 6px; top: 42%; border: 6px solid #fff; border-top: none; border-radius: 0 0 30px 30px; background: linear-gradient(rgba(41,182,246,.55), rgba(2,119,189,.75)); overflow: visible; }
  #tank::before { content: ""; position: absolute; left: 0; right: 0; top: -10px; height: 20px; background: radial-gradient(ellipse at 50% 0, rgba(255,255,255,.7), transparent 70%); }
  .inwater { position: absolute; font-size: clamp(44px, 8vw, 64px); transform: translate(-50%, -50%); line-height: 1; }
  #predict { position: absolute; left: 50%; top: 52%; transform: translate(-50%, 0); display: none; gap: 16px; z-index: 5; }
  #predict.on { display: flex; }
  #predict .big { min-width: 130px; white-space: nowrap; padding: 12px 20px; }
  #held { position: absolute; left: 50%; top: calc(42% - 46px); font-size: 80px; transform: translate(-50%, -50%); display: none; z-index: 4; animation: wob 1s infinite alternate; }
  @keyframes wob { from { transform: translate(-50%, -50%) rotate(-8deg); } to { transform: translate(-50%, -50%) rotate(8deg); } }
  .bubbleUp { position: absolute; width: 10px; height: 10px; border-radius: 50%; border: 2px solid rgba(255,255,255,.8); animation: up 1.2s linear forwards; }
  @keyframes up { to { transform: translateY(-120px); opacity: 0; } }
  /* ramp */
  #ramp { background: linear-gradient(#c8e6c9, #f1f8e9); }
  #rampCv { position: absolute; inset: 0; width: 100%; height: 100%; }
  #rampCtl { position: absolute; top: 80px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 70px; }
  .angle { width: 86px; height: 70px; border-radius: 18px; background: #fff; border: 4px solid #81c784; box-shadow: 0 4px 0 #4caf50; padding: 4px; }
  .angle.sel { border-color: #ff9800; box-shadow: 0 4px 0 #e65100; background: #fff3e0; }
  .angle svg { width: 100%; height: 100%; }
  /* magnet */
  #mag { background: linear-gradient(#ffe0b2, #fff3e0); }
  #magnet { position: absolute; font-size: 90px; transform: translate(-50%, -50%) rotate(180deg); z-index: 6; pointer-events: none; filter: drop-shadow(0 6px 4px rgba(0,0,0,.25)); line-height: 1; }
  .thing { position: absolute; font-size: clamp(44px, 8vw, 60px); transform: translate(-50%, -50%); line-height: 1; pointer-events: none; }
  .thing.shake { animation: shake .4s; }
  @keyframes shake { 25% { margin-left: -8px; } 75% { margin-left: 8px; } }
  #magHint { position: absolute; top: 90px; width: 100%; text-align: center; font-size: 36px; pointer-events: none; }
  #again { white-space: nowrap; position: fixed; top: 45%; left: 50%; transform: translateX(-50%); z-index: 18; display: none; }
  #again.on { display: block; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; width: 100%; height: 100%; }
  body { font-family: "OJ Rubik", "Arial Rounded MT Bold", Arial, sans-serif; }
  button { font-family: inherit; }
  #menuPika { display: flex; justify-content: center; width: auto !important; height: auto !important; animation: ojBob 2.4s ease-in-out infinite; }
  @keyframes ojBob { 50% { transform: translateY(-8px); } }
  #guidePika { width: 110px; height: 110px; display: flex; align-items: flex-end; justify-content: center; }
  .tile { background-image: linear-gradient(160deg, rgba(255,255,255,.35), rgba(0,0,0,.08)) !important; transition: transform .15s; }
  .tile .tstars { position: absolute; bottom: 6px; left: 0; right: 0; font-size: clamp(14px, 3vw, 20px); letter-spacing: -2px; text-shadow: none; }
  .tile.done::after { content: none; }
  .t4 { background-color: #ab47bc; } .t1 { background-color: #29b6f6; } .t2 { background-color: #66bb6a; } .t3 { background-color: #ef5350; }
  .tiles { max-width: 900px; }
  @media (max-width: 600px) { .tile { width: 40vw; height: 22vh; max-height: 160px; } }
  #menu { background: radial-gradient(circle at 50% 30%, #fff59d, #ffcb05 60%, #f5a300); }
  #menu::before { content: "🧪 🔭 🌱 💡 🧲 🌈"; position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 28px; opacity: .35; letter-spacing: 10px; }
  .menuBtns { display: flex; gap: 10px; }
  /* sort */
  #sort { background: linear-gradient(#e1f5fe 0 40%, #fff8e1 100%); }
  #sortQ { position: absolute; top: 84px; left: 0; right: 0; display: flex; justify-content: center; }
  #sortItem { font-size: clamp(80px, 16vh, 130px); line-height: 1; background: #fff; border-radius: 34px; padding: 10px 26px; border: 6px solid #ce93d8; box-shadow: 0 8px 0 #ab47bc; animation: ojBob 1.6s ease-in-out infinite; touch-action: none; cursor: grab; }
  #sortLeft { position: absolute; top: calc(84px + clamp(120px, 20vh, 170px)); left: 0; right: 0; text-align: center; font-size: 26px; letter-spacing: 2px; }
  #bins { position: absolute; left: 8px; right: 8px; bottom: 130px; display: flex; gap: 10px; justify-content: center; }
  .bin { flex: 1; max-width: 260px; min-height: clamp(150px, 26vh, 230px); border-radius: 30px; border: 6px solid #fff; box-shadow: 0 8px 0 rgba(0,0,0,.2); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10px; color: #fff; font-size: clamp(22px, 5vw, 30px); font-weight: 800; text-shadow: 0 2px 2px rgba(0,0,0,.35); position: relative; overflow: hidden; }
  .bin b { font-size: clamp(46px, 10vw, 70px); line-height: 1.1; }
  .bin .got { display: flex; flex-wrap: wrap; justify-content: center; font-size: 26px; gap: 2px; padding: 4px; text-shadow: none; }
  .bin.sea { background: linear-gradient(#4fc3f7, #0277bd); } .bin.land { background: linear-gradient(#aed581, #558b2f); } .bin.sky { background: linear-gradient(#b3e5fc, #7986cb); }
  .bin.hot { outline: 6px dashed #ffeb3b; }
  .fly { position: fixed; z-index: 25; font-size: 80px; transition: all .45s cubic-bezier(.5,-0.3,.6,1); pointer-events: none; transform: translate(-50%,-50%); }
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3949ab">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

</head>
<body>
<div class="top">
  <div class="grp"><div class="stars">⭐ <span id="starCount">0</span></div></div>
  <div class="grp">
    <button class="round" id="sayBtn" aria-label="שוב">🗣️</button>
    <button class="round" id="muteBtn" aria-label="קול">🔊</button>
    <button class="round" id="homeBtn" aria-label="בית">🏠</button>
  </div>
</div>

<div class="screen on" id="menu">
  <div class="inner">
    <h1>המעבדה של פיקאצ'ו 🔬</h1>
    <div id="menuPika"></div>
    <div class="tiles">
      <button class="tile t1" data-go="sink">💧<span>צף או שוקע?</span></button>
      <button class="tile t2" data-go="ramp">⚽<span>מגלשה</span></button>
      <button class="tile t3" data-go="mag">🧲<span>מגנט</span></button>
      <button class="tile t4" data-go="sort">🐠<span>איפה גרים?</span></button>
    </div>
    <div class="menuBtns"><button class="round" id="albumBtn" aria-label="אלבום">📒</button><button class="round" id="helpBtn" aria-label="הסבר">❓</button></div>
    <div data-pwa-slot></div>
  </div>
</div>

<div class="screen" id="sink">
  <div id="tray"></div>
  <div id="tank"></div>
  <div id="held"></div>
  <div id="predict">
    <button class="big green" id="pFloat">⬆️ צף</button>
    <button class="big blue" id="pSink">⬇️ שוקע</button>
  </div>
</div>

<div class="screen" id="ramp">
  <canvas id="rampCv"></canvas>
  <div id="rampCtl">
    <button class="angle" data-a="12"><svg viewBox="0 0 80 50"><polygon points="76,46 4,46 76,32" fill="#ff9800"/></svg></button>
    <button class="angle sel" data-a="25"><svg viewBox="0 0 80 50"><polygon points="76,46 4,46 76,20" fill="#ff9800"/></svg></button>
    <button class="angle" data-a="40"><svg viewBox="0 0 80 50"><polygon points="76,46 4,46 76,4" fill="#ff9800"/></svg></button>
    <button class="big red" id="goBtn">▶ יאללה!</button>
  </div>
</div>

<div class="screen" id="mag">
  <div id="magHint">👆🧲</div>
  <div id="magnet">🧲</div>
</div>

<div class="screen" id="sort">
  <div id="sortQ"><div id="sortItem"></div></div>
  <div id="sortLeft"></div>
  <div id="bins">
    <button class="bin sky" data-h="sky"><b>☁️</b>בשמיים<div class="got"></div></button>
    <button class="bin land" data-h="land"><b>🌳</b>ביבשה<div class="got"></div></button>
    <button class="bin sea" data-h="sea"><b>🌊</b>בים<div class="got"></div></button>
  </div>
</div>

<button class="big yellow" id="again">🔄 עוד פעם!</button>
<div id="guide"><div id="bubble"></div><div id="guidePika"></div></div>
<canvas id="confetti"></canvas>

<script>
(() => {
  const $ = id => document.getElementById(id);
  // ---------- sound ----------
  let actx = null, muted = false;
  function ac() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (actx && actx.state === 'suspended') actx.resume(); return actx; }
  function tone(f, d, type = 'sine', v = 0.2, delay = 0, to = null) {
    if (muted || !OJ.sfxOn) return; const a = ac(); if (!a) return; const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.05);
  }
  const sfx = {
    tap() { tone(700, 0.08, 'triangle', 0.2); },
    yes() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.22, i * 0.09)); },
    oops() { tone(500, 0.2, 'sine', 0.2); tone(420, 0.3, 'sine', 0.2, 0.15); },
    splash() { tone(300, 0.25, 'sine', 0.2, 0, 900); },
    sinkS() { tone(500, 0.6, 'sine', 0.15, 0, 120); },
    roll() { tone(200, 0.3, 'triangle', 0.1, 0, 400); },
    click() { tone(1400, 0.06, 'square', 0.12); tone(1800, 0.06, 'square', 0.08, 0.04); },
    boing() { tone(300, 0.25, 'sine', 0.2, 0, 600); },
    party() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.2, 'triangle', 0.22, i * 0.11)); }
  };

  // ---------- speech ----------
  let heVoice = null, lastSay = '';
  function findVoice() { if (!('speechSynthesis' in window)) return; const vs = speechSynthesis.getVoices(); heVoice = vs.find(v => /^(he|iw)/i.test(v.lang)) || null; }
  if ('speechSynthesis' in window) { findVoice(); speechSynthesis.onvoiceschanged = findVoice; }
  let bubbleT = null;
  function say(text, speak = text) {
    lastSay = text;
    const b = $('bubble'); b.textContent = text; b.classList.add('show'); guideHappy = 2.5;
    clearTimeout(bubbleT); bubbleT = setTimeout(() => b.classList.remove('show'), 7000);
    if (!muted && OJ.sfxOn && heVoice && speak) {
      try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(speak.replace(/[^\u0590-\u05FF\s,.!?'"-]/g, '')); u.voice = heVoice; u.lang = heVoice.lang; u.rate = 0.9; u.pitch = 1.2; speechSynthesis.speak(u); } catch (e) {}
    }
  }
  $('sayBtn').onclick = () => { if (lastSay) say(lastSay); };
  const paintMute = () => { $('muteBtn').textContent = OJ.sfxOn ? '🔊' : '🔇'; }; paintMute();
  $('muteBtn').onclick = () => { OJ.sfxOn = !OJ.sfxOn; paintMute(); if (!OJ.sfxOn && window.speechSynthesis) speechSynthesis.cancel(); };

  // ---------- stars ----------
  let stars = 0; const addStar = (n = 1) => { stars += n; $('starCount').textContent = stars; };

  // ---------- drawing ----------
  function drawMouse(c, x, y, s, opts = {}) {
    const { dizzy = 0, happy = 0, t = 0, facing = 1 } = opts;
    c.save(); c.translate(x, y); c.scale(facing * s / 100, s / 100);
    c.lineJoin = 'round'; c.lineCap = 'round';
    const Y = '#ffd83a', O = '#5a3b00';
    // tail (lightning bolt)
    c.save(); c.translate(-38, 15); c.rotate(-0.25 + Math.sin(t * 6) * 0.08);
    c.beginPath(); c.moveTo(0, 0); c.lineTo(-18, -22); c.lineTo(-8, -26); c.lineTo(-30, -52); c.lineTo(-10, -56); c.lineTo(-38, -92); c.lineTo(-2, -60); c.lineTo(-14, -56); c.lineTo(4, -30); c.lineTo(-6, -26); c.lineTo(10, -4); c.closePath();
    c.fillStyle = Y; c.fill(); c.lineWidth = 3; c.strokeStyle = O; c.stroke();
    c.beginPath(); c.moveTo(0, 0); c.lineTo(-10, -14); c.lineTo(4, -10); c.closePath(); c.fillStyle = '#8b5a00'; c.fill();
    c.restore();
    // feet
    c.fillStyle = Y; c.strokeStyle = O; c.lineWidth = 3;
    [[-20, 42], [20, 42]].forEach(([fx, fy]) => { c.beginPath(); c.ellipse(fx, fy, 14, 8, 0, 0, Math.PI * 2); c.fill(); c.stroke(); });
    // body
    c.beginPath(); c.ellipse(0, 15, 38, 32, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    // back stripes hint
    // ears
    const ear = (dir) => {
      c.save(); c.translate(dir * 20, -40); c.rotate(dir * (0.45 + Math.sin(t * 4) * 0.04));
      c.beginPath(); c.moveTo(-10, 0); c.quadraticCurveTo(-8, -40, 0, -62); c.quadraticCurveTo(8, -40, 10, 0); c.closePath();
      c.fillStyle = Y; c.fill(); c.stroke();
      c.save(); c.clip(); c.fillStyle = '#222'; c.fillRect(-15, -70, 30, 26); c.restore();
      c.beginPath(); c.moveTo(-10, 0); c.quadraticCurveTo(-8, -40, 0, -62); c.quadraticCurveTo(8, -40, 10, 0); c.stroke();
      c.restore();
    };
    ear(-1); ear(1);
    // head
    c.beginPath(); c.ellipse(0, -25, 40, 34, 0, 0, Math.PI * 2); c.fillStyle = Y; c.fill(); c.stroke();
    // arms
    c.beginPath(); c.ellipse(-24, 12, 9, 6, 0.6, 0, Math.PI * 2); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(24, 12, 9, 6, -0.6, 0, Math.PI * 2); c.fill(); c.stroke();
    // cheeks
    c.fillStyle = '#ff3b3b';
    c.beginPath(); c.arc(-27, -14, 9, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(27, -14, 9, 0, Math.PI * 2); c.fill();
    // eyes
    if (dizzy > 0) {
      c.strokeStyle = '#222'; c.lineWidth = 3;
      [-15, 15].forEach(ex => { c.beginPath(); for (let a = 0; a < 12; a += 0.3) { const r = a * 0.7; const px = ex + Math.cos(a + t * 8) * r, py = -30 + Math.sin(a + t * 8) * r; a === 0 ? c.moveTo(px, py) : c.lineTo(px, py); } c.stroke(); });
    } else if (happy > 0) {
      c.strokeStyle = '#222'; c.lineWidth = 4;
      [-15, 15].forEach(ex => { c.beginPath(); c.arc(ex, -28, 7, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); });
    } else {
      c.fillStyle = '#222';
      [-15, 15].forEach(ex => { c.beginPath(); c.arc(ex, -30, 7, 0, Math.PI * 2); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(ex - 2, -33, 2.6, 0, Math.PI * 2); c.fill(); c.fillStyle = '#222'; });
    }
    // nose
    c.fillStyle = '#222'; c.beginPath(); c.ellipse(0, -21, 2.5, 1.8, 0, 0, Math.PI * 2); c.fill();
    // mouth
    c.strokeStyle = '#222'; c.lineWidth = 2.5;
    if (happy > 0 || dizzy === 0) {
      c.beginPath(); c.moveTo(-8, -15); c.quadraticCurveTo(-4, -10, 0, -15); c.quadraticCurveTo(4, -10, 8, -15); c.stroke();
      if (happy > 0) { c.fillStyle = '#c0392b'; c.beginPath(); c.moveTo(-6, -14); c.quadraticCurveTo(0, -2, 6, -14); c.closePath(); c.fill(); }
    } else { c.beginPath(); c.arc(0, -11, 4, 0, Math.PI * 2); c.stroke(); }
    c.restore();
    if (dizzy > 0) { // circling stars
      for (let i = 0; i < 3; i++) { const a = t * 5 + i * 2.1; drawStar(c, x + Math.cos(a) * s * 0.45, y - s * 0.75 + Math.sin(a) * s * 0.12, s * 0.09, '#fff176'); }
    }
  }

  function drawStar(c, x, y, r, col) {
    c.save(); c.translate(x, y); c.beginPath();
    for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * 0.45 : r; const a = -Math.PI / 2 + i * Math.PI / 5; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    c.closePath(); c.fillStyle = col; c.fill(); c.lineWidth = 2; c.strokeStyle = '#e6a700'; c.stroke(); c.restore();
  }


  let guideHappy = 0, T = 0;

      if (busy || i >= q.length) return; const o = q[i], bin = document.querySelector(`.bin[data-h="${h}"]`);
      if (o.h !== h) { miss++; OJ.sfx('bad'); OJ.shake(bin); mood('oops'); say('לא שם... ' + o.n + ' גר במקום אחר. נסה שוב!'); return; }
      busy = true; OJ.sfx('good'); addStar(); mood('cheer');
      const r = item.getBoundingClientRect(), br = bin.getBoundingClientRect();
      const f = document.createElement('div'); f.className = 'fly'; f.textContent = o.e; f.style.left = (r.left + r.width / 2) + 'px'; f.style.top = (r.top + r.height / 2) + 'px'; document.body.appendChild(f);
      item.style.visibility = 'hidden';
      requestAnimationFrame(() => requestAnimationFrame(() => { f.style.left = (br.left + br.width / 2) + 'px'; f.style.top = (br.top + br.height * .7) + 'px'; f.style.fontSize = '30px'; }));
      say('נכון! ' + o.why);
      setTimeout(() => { f.remove(); const s = document.createElement('span'); s.textContent = o.e; bin.querySelector('.got').appendChild(s); OJ.sparkle(bin, { n: 10 }); OJ.bounce(bin);
        i++; busy = false;
        if (i >= q.length) { $('sortLeft').textContent = ''; markDone('sort'); setTimeout(() => party('לדגים יש סנפירים לים, לציפורים כנפיים לשמיים, ולחיות היבשה רגליים!', 'כל הכבוד! לדגים יש סנפירים, לציפורים יש כנפיים, ולחיות היבשה יש רגליים!', miss === 0 ? 3 : miss <= 2 ? 2 : 1), 900); }
        else show(); }, 500);
    }
    document.querySelectorAll('.bin').forEach(b => b.onclick = () => { ac(); drop(b.dataset.h); });
    // drag the animal onto a home
    let drag = null;
    item.addEventListener('pointerdown', e => { if (busy) return; ac(); drag = { x: e.clientX, y: e.clientY }; item.setPointerCapture(e.pointerId); item.style.animation = 'none'; });
    item.addEventListener('pointermove', e => { if (!drag) return; item.style.transform = `translate(${e.clientX - drag.x}px, ${e.clientY - drag.y}px) scale(1.1)`;
      const t = document.elementsFromPoint(e.clientX, e.clientY).find(x => x.classList && x.classList.contains('bin')); document.querySelectorAll('.bin').forEach(b => b.classList.toggle('hot', b === t)); });
    item.addEventListener('pointerup', e => { if (!drag) return; drag = null; item.style.transform = ''; item.style.animation = '';
      document.querySelectorAll('.bin').forEach(b => b.classList.remove('hot'));
      const t = document.elementsFromPoint(e.clientX, e.clientY).find(x => x.classList && x.classList.contains('bin')); if (t) drop(t.dataset.h); });
    return { start, drop, get cur() { return q[i]; } };
  })();

  requestAnimationFrame(pikaLoop);
