<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; min-height: 100%; font-family: "Arial Rounded MT Bold", "Varela Round", Arial, sans-serif; background: radial-gradient(circle at 50% 0, #fff59d, #ffca28 35%, #5c6bc0 100%); }

  .card { position: relative; width: 100%; background: #fff; border: 6px solid #ffcb05; border-radius: 30px; padding: 12px 12px 14px; box-shadow: 0 8px 0 rgba(0,0,0,.2); margin-top: 6px; text-align: center; }

  .qtext.readq { font-size: clamp(30px, 8vw, 46px); margin: 6px 4px; color: #b71c1c; }

  .ch .em { font-size: 1.25em; }
  .ch .tx { font-size: .55em; margin-top: 4px; }

  #parent table { border-collapse: collapse; font-size: 18px; margin: 8px auto; }

  #parent .note { font-size: 15px; color: #666; max-width: 520px; margin: 4px auto; }

<script>
(() => {
  const el = id => document.getElementById(id);
  function drawMouse(c, x, y, s, opts = {}) {
    const { dizzy = 0, happy = 0, t = 0, facing = 1 } = opts;
    c.save(); c.translate(x, y); c.scale(facing * s / 100, s / 100);
    c.lineJoin = 'round'; c.lineCap = 'round';
    const Y = '#ffd83a', O = '#5a3b00';
    // tail (lightning bolt)
    c.save(); c.translate(-38, 15); c.rotate(-0.25 + Math.sin(t * 6) * 0.08);
    c.beginPath(); c.moveTo(0, 0); c.lineTo(-18, -22); c.lineTo(-8, -26); c.lineTo(-30, -52); c.lineTo(-10, -56); c.lineTo(-38, -92); c.lineTo(-2, -60); c.lineTo(-14, -56); c.lineTo(4, -30); c.lineTo(-6, -26); c.lineTo(10, -4); c.closePath();
    c.fillStyle = Y; c.fill(); c.lineWidth = 3; c.strokeStyle = O; c.stroke();
    c.beginPath(); c.moveTo(0, 0); c.lineTo(-10, -14); c.lineTo(4, -10); c.closePath(); c.fillStyle = '#8b5a00'; c.fill();
    c.restore();
    // feet
    c.fillStyle = Y; c.strokeStyle = O; c.lineWidth = 3;
    [[-20, 42], [20, 42]].forEach(([fx, fy]) => { c.beginPath(); c.ellipse(fx, fy, 14, 8, 0, 0, Math.PI * 2); c.fill(); c.stroke(); });
    // body
    c.beginPath(); c.ellipse(0, 15, 38, 32, 0, 0, Math.PI * 2); c.fill(); c.stroke();
    // back stripes hint
    // ears
    const ear = (dir) => {
      c.save(); c.translate(dir * 20, -40); c.rotate(dir * (0.45 + Math.sin(t * 4) * 0.04));
      c.beginPath(); c.moveTo(-10, 0); c.quadraticCurveTo(-8, -40, 0, -62); c.quadraticCurveTo(8, -40, 10, 0); c.closePath();
      c.fillStyle = Y; c.fill(); c.stroke();
      c.save(); c.clip(); c.fillStyle = '#222'; c.fillRect(-15, -70, 30, 26); c.restore();
      c.beginPath(); c.moveTo(-10, 0); c.quadraticCurveTo(-8, -40, 0, -62); c.quadraticCurveTo(8, -40, 10, 0); c.stroke();
      c.restore();
    };
    ear(-1); ear(1);
    // head
    c.beginPath(); c.ellipse(0, -25, 40, 34, 0, 0, Math.PI * 2); c.fillStyle = Y; c.fill(); c.stroke();
    // arms
    c.beginPath(); c.ellipse(-24, 12, 9, 6, 0.6, 0, Math.PI * 2); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(24, 12, 9, 6, -0.6, 0, Math.PI * 2); c.fill(); c.stroke();
    // cheeks
    c.fillStyle = '#ff3b3b';
    c.beginPath(); c.arc(-27, -14, 9, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(27, -14, 9, 0, Math.PI * 2); c.fill();
    // eyes
    if (dizzy > 0) {
      c.strokeStyle = '#222'; c.lineWidth = 3;
      [-15, 15].forEach(ex => { c.beginPath(); for (let a = 0; a < 12; a += 0.3) { const r = a * 0.7; const px = ex + Math.cos(a + t * 8) * r, py = -30 + Math.sin(a + t * 8) * r; a === 0 ? c.moveTo(px, py) : c.lineTo(px, py); } c.stroke(); });
    } else if (happy > 0) {
      c.strokeStyle = '#222'; c.lineWidth = 4;
      [-15, 15].forEach(ex => { c.beginPath(); c.arc(ex, -28, 7, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); });
    } else {
      c.fillStyle = '#222';
      [-15, 15].forEach(ex => { c.beginPath(); c.arc(ex, -30, 7, 0, Math.PI * 2); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(ex - 2, -33, 2.6, 0, Math.PI * 2); c.fill(); c.fillStyle = '#222'; });
    }
    // nose
    c.fillStyle = '#222'; c.beginPath(); c.ellipse(0, -21, 2.5, 1.8, 0, 0, Math.PI * 2); c.fill();
    // mouth
    c.strokeStyle = '#222'; c.lineWidth = 2.5;
    if (happy > 0 || dizzy === 0) {
      c.beginPath(); c.moveTo(-8, -15); c.quadraticCurveTo(-4, -10, 0, -15); c.quadraticCurveTo(4, -10, 8, -15); c.stroke();
      if (happy > 0) { c.fillStyle = '#c0392b'; c.beginPath(); c.moveTo(-6, -14); c.quadraticCurveTo(0, -2, 6, -14); c.closePath(); c.fill(); }
    } else { c.beginPath(); c.arc(0, -11, 4, 0, Math.PI * 2); c.stroke(); }
    c.restore();
    if (dizzy > 0) { // circling stars
      for (let i = 0; i < 3; i++) { const a = t * 5 + i * 2.1; drawStar(c, x + Math.cos(a) * s * 0.45, y - s * 0.75 + Math.sin(a) * s * 0.12, s * 0.09, '#fff176'); }
    }
  }

  function drawStar(c, x, y, r, col) {
    c.save(); c.translate(x, y); c.beginPath();
    for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * 0.45 : r; const a = -Math.PI / 2 + i * Math.PI / 5; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    c.closePath(); c.fillStyle = col; c.fill(); c.lineWidth = 2; c.strokeStyle = '#e6a700'; c.stroke(); c.restore();
  }
/* ===== helpers ===== */
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => (typeof n === 'number' && Math.abs(n) >= 1000) ? n.toLocaleString('en-US') : String(n);
const P = (L, he, en) => L === 'en' ? en : he;
const mix = (...fs) => pick(fs)();
const ONES = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function numWord(n) {
  if (n < 20) return ONES[n];
  if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
  if (n === 100) return 'one hundred';
  return String(n);
}
// build a choice list: vals[0] is the answer
function mk(vals, o = {}) {
  const uniq = []; vals.forEach(v => { if (!uniq.some(u => u === v)) uniq.push(v); });
  let list = [uniq[0], ...shuffle(uniq.slice(1)).slice(0, (o.n || 4) - 1)];
  list = o.sort ? list.slice().sort((a, b) => a - b) : shuffle(list);
  return { choices: list.map(v => ({ v, t: o.label ? o.label(v) : fmt(v), say: o.say ? o.say(v) : null, rtl: !!o.rtl })), ans: list.indexOf(uniq[0]) };
}
// plausible numeric distractors (answer first)
function near(ans, extra = []) {
  const ok = x => Number.isInteger(x) && x >= 0 && x !== ans;
  const out = shuffle(extra.filter(ok)).slice(0, 2);
  const st = [];
  if (ans < 30) st.push(1, 2, 3); else st.push(1, 10);
  if (ans >= 30 && ans < 1000) st.push(2, 20);
  if (ans >= 100) st.push(100, 10);
  if (ans >= 1000) st.push(1000, 100, 1000);
  if (ans >= 10000) st.push(10000, 10000);
  if (ans >= 100000) st.push(100000);
  const pool = shuffle(st.flatMap(s => [ans + s, ans - s])).filter(ok);
  return [ans, ...out, ...pool];
}
function fracHTML(k, d) { return `<span class="frac"><b>${k}</b><span>${d}</span></span>`; }
/* ===== MATH ===== */
const OPS = { '+': ['+', 'ועוד', 'plus', (a, b) => a + b], '-': ['−', 'פחות', 'minus', (a, b) => a - b], '*': ['×', 'כפול', 'times', (a, b) => a * b], '/': ['÷', 'חלקי', 'divided by', (a, b) => a / b] };
const ITEMS = [{ he: 'תותים', en: 'strawberries', e: '🍓' }, { he: 'כדורים', en: 'balls', e: '⚽' }, { he: 'מדבקות', en: 'stickers', e: '⭐' }, { he: 'עוגיות', en: 'cookies', e: '🍪' }, { he: 'קלפים', en: 'cards', e: '🃏' }, { he: 'בלונים', en: 'balloons', e: '🎈' }, { he: 'תפוחים', en: 'apples', e: '🍎' }];
const HEROES = [["פיקאצ'ו", 'Pikachu'], ['אש', 'Ash'], ['בולבזאור', 'Bulbasaur'], ["צ'רמנדר", 'Charmander'], ['סקווירטל', 'Squirtle']];
const PLACE_HE = ['אחדות', 'עשרות', 'מאות', 'אלפים', 'עשרות האלפים', 'מאות האלפים'];
const PLACE_EN = ['ones', 'tens', 'hundreds', 'thousands', 'ten-thousands', 'hundred-thousands'];

function genEng(lvl) {

    case 1: return eHear(lvl, ['animal'], false, 3);
    case 2: return mix(() => eHear(lvl, ['animal', 'color'], false), () => eNum(lvl, 10, false));
    case 3: return eHear(lvl, ['food', 'thing'], false);
    case 4: return mix(() => eHear(lvl, Object.keys(EN), false), () => eNum(lvl, 20, false));
    case 5: return eHear(lvl, Object.keys(EN), true);
    case 6: return mix(() => eNum(lvl, 100, false), () => eHear(lvl, Object.keys(EN), true), () => eColor());
    case 7: return mix(() => eRead(lvl, ['animal', 'thing'], false), () => eColor());
    case 8: return mix(() => eRead(lvl, Object.keys(EN), true), () => eNum(lvl, 20, true));
    case 9: return mix(() => eColor(), () => eRead(lvl, Object.keys(EN), true));
    default: return mix(() => eNum(lvl, 100, true), () => eRead(lvl, Object.keys(EN), true), () => eColor());
  }
}
/* ===== APP ===== */
const TR = {
  math: { name: 'חשבון', icon: '🔢', max: 20, start: 5 },
  logic: { name: 'דפוסים והיגיון', icon: '🧩', max: 15, start: 3 },
  spatial: { name: 'חשיבה מרחבית', icon: '🧊', max: 12, start: 2 },
  read: { name: 'קריאה', icon: '📖', max: 12, start: 1 },
  sci: { name: 'מדע', icon: '🔬', max: 10, start: 2 },
  eng: { name: 'English', icon: '🇬🇧', max: 10, start: 1 }
};
const SKEY = 'omerBrain';
const GEN = { math: l => genMath(l, S.lang), logic: genLogic, spatial: genSpatial, read: genRead, sci: genSci, eng: genEng };
const clampL = (t, l) => Math.max(1, Math.min(TR[t].max, l | 0 || TR[t].start));
function fresh() { return { stars: 0, lang: 'he', autoRead: true, t: {} }; }
function load() {
  let s = null; try { s = JSON.parse(localStorage.getItem(SKEY)); } catch (e) {}
  s = Object.assign(fresh(), s || {}); s.stars |= 0;
  for (const t in TR) { const d = s.t[t] || {}; s.t[t] = { lvl: clampL(t, d.lvl), ok: d.ok | 0, tot: d.tot | 0, streak: d.streak | 0, wrong: d.wrong | 0, best: Math.max(d.best | 0, clampL(t, d.lvl)) }; }
  return s;
}
let S = load();
const save = () => { try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {} };

/* speech */
let voices = [];
const loadVoices = () => { try { voices = speechSynthesis.getVoices() || []; } catch (e) {} };
if (window.speechSynthesis) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch (e) {} }
function speak(text, lang = 'he', queue = false) {
  if (!window.speechSynthesis || !text || !window.SpeechSynthesisUtterance) return;
  try {
    if (!queue) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g, ' ').replace(/[☐❓]/g, ' '));
    u.lang = lang === 'en' ? 'en-US' : 'he-IL';
    const want = lang === 'en' ? ['en-us', 'en'] : ['he', 'iw'];
    const v = voices.find(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith(want[0])) || voices.find(v => v.lang && v.lang.toLowerCase().startsWith(want[1]));
    if (v) u.voice = v;
    u.rate = lang === 'en' ? 0.9 : 0.95; u.pitch = 1.1;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* bidi-safe hint lines: math runs stay left-to-right inside Hebrew text */
const MATHRUN = /(\(?\d+(?:[,.]\d+)*\)?(?:\s*(?:[+\-−×÷=<>:➜]|,)\s*\(?(?:\d+(?:[,.]\d+)*|☐|\?)\)?)+)/g;
function hintHTML(h) {
  return String(h || '').split('\n').map(line => /[\u05D0-\u05EA]/.test(line) ? `<div>${line.replace(MATHRUN, m => `<span class="ltrm">${m}</span>`)}</div>` : `<div dir="ltr">${line}</div>`).join('');
}
const isEmo = t => /^\p{Extended_Pictographic}/u.test(t) && t.length <= 8;
/* pikachu helpers */
function drawPika(id, happy) { const cv = el(id); const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height); drawMouse(c, cv.width * .52, cv.height * .64, cv.width * .62, { happy }); }

/* home */
function renderHome() {
  el('starsH').textContent = '⭐ ' + S.stars; el('starsP').textContent = '⭐ ' + S.stars;
  el('tracks').innerHTML = Object.entries(TR).map(([id, t]) => `<button class="track t-${id}" data-t="${id}"><span class="ic">${t.icon}</span><span class="nm">${t.name}</span><span class="lv">שלב ${S.t[id].lvl}</span></button>`).join('');
  el('tracks').querySelectorAll('.track').forEach(b => b.addEventListener('click', () => startTrack(b.dataset.t)));
}
let curT = null, cur = null, locked = false, tStart = 0, quick = [], nextTimer = 0;
const recent = {};
function nextQ(t) {
  const lvl = S.t[t].lvl; const r = recent[t] || (recent[t] = []); let q;
  for (let i = 0; i < 40; i++) { q = GEN[t](lvl); if (!r.includes(q.key)) break; }
  r.push(q.key); if (r.length > 30) r.shift(); q.level = lvl; return q;
}
function startTrack(t) {
  curT = t; quick = []; el('home').classList.add('hide'); el('play').classList.remove('hide');
  speak(TR[t].name === 'English' ? 'אנגלית' : TR[t].name);
  show();
}
function goHome() { clearTimeout(nextTimer); curT = null; el('play').classList.add('hide'); el('home').classList.remove('hide'); el('hint').classList.add('hide'); renderHome(); drawPika('hero', 1); if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) {} }
function header() {
  const st = S.t[curT];
  el('ptName').textContent = TR[curT].icon + ' ' + TR[curT].name; el('ptLv').textContent = 'שלב ' + st.lvl + ' / ' + TR[curT].max;
  el('bar').style.width = Math.min(100, (st.streak % 3) / 3 * 100) + '%';
  el('starsP').textContent = '⭐ ' + S.stars;
  const lb = el('langBtn'); lb.classList.toggle('hide', curT !== 'math'); lb.textContent = S.lang === 'en' ? '🇬🇧' : '🇮🇱'; lb.classList.toggle('en', S.lang === 'en');
}
function sayQ() { if (cur) speak(cur.say || cur.text, cur.lang); }
function show() {
  clearTimeout(nextTimer);
  cur = nextQ(curT); locked = false; tStart = Date.now(); render();
  if (S.autoRead) setTimeout(sayQ, 250);
}
function render() {
  const q = cur; header();
  el('card').classList.toggle('ltr', q.lang === 'en');
  el('qtext').textContent = q.text || '';
  el('qtext').classList.toggle('hide', !q.text);
  const eq = el('eq'); eq.innerHTML = q.eq ? q.eq.replace('☐', '<span style="color:#e53935">☐</span>') : '';
  if (q.eq) { const len = q.eq.length; eq.style.fontSize = Math.max(24, Math.min(64, Math.floor(Math.min(innerWidth * .86, 760) / (len * .6)))) + 'px'; }
  el('vis').innerHTML = q.vis || '';
  const ch = el('choices'); ch.className = 'choices' + (q.choices.length === 3 ? ' c3' : '');
  ch.innerHTML = q.choices.map((c, i) => `<button class="ch${c.rtl ? ' rtl' : ''}${isEmo(String(c.t)) ? ' emo' : ''}" data-i="${i}">${c.say ? '<span class="spk" data-s="' + i + '">🔈</span>' : ''}${c.t}</button>`).join('');
  ch.querySelectorAll('.ch').forEach(b => b.addEventListener('click', e => {
    if (e.target.closest('.spk')) { e.stopPropagation(); speak(q.choices[+b.dataset.i].say, q.lang); return; }
    choose(+b.dataset.i);
  }));
  el('hint').classList.add('hide');
  drawPika('guide', 0);
}
const PRAISE_HE = ['יופי!', 'מעולה!', 'אלוף!', 'גאון!', 'כל הכבוד!', 'וואו!', 'מדויק!', 'פיקה פיקה!'];
const PRAISE_EN = ['Great!', 'Awesome!', 'Super!', 'Well done!', 'Perfect!', 'Yes!'];
function toast(t) { const x = el('toast'); x.textContent = t; x.classList.add('on'); setTimeout(() => x.classList.remove('on'), 700); }
function choose(i) {
  if (locked || !cur) return; locked = true;
  const st = S.t[curT], ok = i === cur.ans, btns = el('choices').querySelectorAll('.ch');
  st.tot++;
  if (ok) {
    st.ok++; st.streak++; S.stars++; quick.push(Date.now() - tStart < 9000);
    btns[i].classList.add('ok'); btns.forEach((b, j) => j !== i && b.classList.add('dim'));
    drawPika('guide', 1); toast('⭐'); speak(cur.lang === 'en' ? pick(PRAISE_EN) : pick(PRAISE_HE), cur.lang);
    let up = 0;
    if (st.streak >= 3) { up = 1; if (curT === 'math' && quick.slice(-3).length === 3 && quick.slice(-3).every(Boolean)) up = 2; st.streak = 0; }
    if (up && st.lvl < TR[curT].max) {
      const nl = Math.min(TR[curT].max, st.lvl + up); st.lvl = nl; st.wrong = 0; quick = []; st.best = Math.max(st.best, nl); S.stars += 3; save(); header();
      nextTimer = setTimeout(() => levelUp(nl), 800);
    } else { save(); header(); nextTimer = setTimeout(show, 1100); }
  } else {
    st.streak = 0; quick = []; st.wrong++;
    btns[i].classList.add('bad'); btns[cur.ans].classList.add('ok');
    let down = '';
    if (st.wrong >= 2) { st.wrong = 0; if (st.lvl > 1) { st.lvl--; down = 'נתאמן רגע בשלב ' + st.lvl + ' ואז נעלה שוב 💪'; } }
    save(); header();
    el('hintTx').innerHTML = `<div>💡 לא נורא! בואו נבין:</div><div class="hx">${hintHTML(cur.hint)}</div>${down ? `<div style="margin-top:6px">${down}</div>` : ''}`;
    el('hint').classList.remove('hide');
    speak((cur.lang === 'en' ? 'Good try! ' : 'לא נורא! ') + String(cur.hint || '').replace(/\n/g, '. ').replace(/×/g, cur.lang === 'en' ? ' times ' : ' כפול ').replace(/÷/g, cur.lang === 'en' ? ' divided by ' : ' חלקי ').replace(/−/g, cur.lang === 'en' ? ' minus ' : ' פחות ').replace(/ = /g, cur.lang === 'en' ? ' equals ' : ' שווה ').replace(/,(?=\d{3})/g, ''), cur.lang);
    setTimeout(() => el('hint').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
  }
}
function levelUp(n) {
  el('upTx').textContent = `עלית לשלב ${n}! ⚡`; drawPika('upHero', 1); el('upOv').classList.remove('hide');
  speak(`כל הכבוד! עלית לשלב ${n}!`);
}
el('upGo').addEventListener('click', () => { el('upOv').classList.add('hide'); show(); });
el('gotIt').addEventListener('click', show);
el('backBtn').addEventListener('click', goHome);
el('homeBtn').addEventListener('click', () => { location.href = '../index.html'; });
el('sayBtn').addEventListener('click', sayQ);
el('sayHome').addEventListener('click', () => speak('חדר כושר למוח! בחרו אימון: ' + Object.values(TR).map(t => t.name === 'English' ? 'אנגלית' : t.name).join(', ')));
el('langBtn').addEventListener('click', () => { S.lang = S.lang === 'en' ? 'he' : 'en'; save(); speak(S.lang === 'en' ? 'English' : 'עברית', S.lang); show(); });

/* parent panel: long-press the title */
let lp = 0;
const t0 = el('title');
t0.addEventListener('pointerdown', () => { clearTimeout(lp); lp = setTimeout(openParent, 800); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => t0.addEventListener(ev, () => clearTimeout(lp)));
t0.addEventListener('contextmenu', e => e.preventDefault());
function openParent() {
  const rows = Object.entries(TR).map(([id, t]) => {
    const st = S.t[id]; const acc = st.tot ? Math.round(st.ok / st.tot * 100) + '%' : '–';
    const opts = Array.from({ length: t.max }, (_, i) => i + 1).map(l => `<option value="${l}" ${l === st.lvl ? 'selected' : ''}>${l}${id === 'math' ? ' – ' + MATH_DESC[l] : ''}</option>`).join('');
    return `<tr><td>${t.icon} ${t.name}</td><td>${st.lvl}<br><small>שיא ${st.best}</small></td><td>${acc}<br><small>${st.ok}/${st.tot}</small></td><td><select data-t="${id}">${opts}</select></td></tr>`;
  }).join('');
  el('ptab').innerHTML = `<tr><th>מסלול</th><th>שלב</th><th>דיוק</th><th>קבע שלב</th></tr>` + rows;
  el('ptab').querySelectorAll('select').forEach(s => s.addEventListener('change', () => { const st = S.t[s.dataset.t]; st.lvl = clampL(s.dataset.t, +s.value); st.best = Math.max(st.best, st.lvl); st.streak = 0; st.wrong = 0; save(); renderHome(); openParent(); }));
  el('autoRead').checked = !!S.autoRead;
  el('parent').classList.remove('hide');
}
el('autoRead').addEventListener('change', e => { S.autoRead = e.target.checked; save(); });
el('closeParent').addEventListener('click', () => { el('parent').classList.add('hide'); renderHome(); });
el('resetBtn').addEventListener('click', () => { if (confirm('לאפס את כל ההתקדמות?')) { S = fresh(); save(); S = load(); save(); openParent(); renderHome(); } });

renderHome(); drawPika('hero', 1);
window.__brain = { hintHTML, get S() { return S; }, get cur() { return cur; }, get curT() { return curT; }, TR, GEN, gens: { genMath, genLogic, genSpatial, genRead, genSci, genEng }, numWord, choose, startTrack, goHome, openParent, nextQ, show,
  setLevel(t, l) { S.t[t].lvl = clampL(t, l); S.t[t].streak = 0; S.t[t].wrong = 0; save(); } };
})();
</script>
