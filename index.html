<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המשחקים של עומר 🎮</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--oj-font,"Varela Round","Arial Rounded MT Bold",Arial,sans-serif);background:radial-gradient(circle at 20% 10%,#fff6c8 0,transparent 35%),linear-gradient(#ffe082,#ffcb05 40%,#c77d3a 40%,#a0612a);display:flex;flex-direction:column;align-items:center;padding:12px 8px 20px;user-select:none}
h1{font-size:clamp(24px,5.6vw,50px);color:#3b4cca;text-shadow:3px 3px 0 #fff,0 6px 12px rgba(59,76,202,.25);margin:4px 0 6px;text-align:center;display:flex;align-items:center;gap:8px;justify-content:center}
#heroP{display:inline-block;animation:hb 2.4s ease-in-out infinite;cursor:pointer}@keyframes hb{50%{transform:translateY(-6px) rotate(-4deg)}}
.topbar{display:flex;gap:10px;justify-content:center;align-items:center;margin:0 0 6px}
.chip{border:4px solid #fff;border-radius:999px;padding:6px 16px;font:bold clamp(18px,4.4vw,24px) inherit;font-family:inherit;color:#fff;background:linear-gradient(#ff9f43,#ee5a24);box-shadow:0 5px 0 rgba(0,0,0,.25);cursor:pointer}
.chip.stars{background:linear-gradient(#ffd54f,#f9a825);color:#6d3d14;cursor:default}.chip:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.gstars{font-size:clamp(14px,3.6vw,18px);background:rgba(0,0,0,.22);border-radius:999px;padding:2px 10px;font-weight:bold}
a.box{animation:pop .5s cubic-bezier(.3,1.6,.5,1) backwards}a.box:nth-child(2){animation-delay:.08s}a.box:nth-child(3){animation-delay:.16s}@keyframes pop{from{transform:scale(.6);opacity:0}}
@media (hover:hover){a.box:hover{transform:translateY(-6px) rotate(-1.5deg)}}
.store{position:relative;width:100%;max-width:980px;flex:1;display:flex;align-items:center;min-height:0}
.view{overflow:hidden;flex:1;height:100%;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.shelf{flex:0 0 100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 6px}
.sign{background:#fff;border:5px solid #6d3d14;border-radius:22px;padding:6px 22px;font-size:clamp(24px,6vw,40px);font-weight:bold;color:#6d3d14;margin-bottom:14px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.wood{width:100%;max-width:820px;background:linear-gradient(#8d5524,#6d3d14);border:8px solid #4e2a0c;border-radius:20px;padding:18px 12px 0;display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.wood:after{content:"";flex-basis:100%;height:22px;margin:0 -12px;background:linear-gradient(#c68642,#8d5524);border-top:4px solid #e0a060}
a.box{text-decoration:none;-webkit-user-drag:none;width:clamp(130px,38vw,210px);border-radius:18px;border:5px solid #fff;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,.35);transition:transform .15s}
a.box:active{transform:translateY(5px)}
.icon{font-size:clamp(54px,14vw,84px);line-height:1}
.name{font-size:clamp(18px,4.6vw,26px);font-weight:bold;text-align:center;text-shadow:0 2px 3px rgba(0,0,0,.4)}
.arrow{flex:0 0 auto;width:clamp(52px,13vw,84px);height:clamp(52px,13vw,84px);border-radius:50%;border:5px solid #fff;background:#3b4cca;color:#fff;font-size:clamp(26px,7vw,44px);cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.3);z-index:2}
.arrow:disabled{opacity:.3}
.dots{display:flex;gap:12px;margin-top:10px;direction:ltr}
.dot{font-size:30px;padding:4px 10px;border-radius:16px;background:rgba(255,255,255,.4);border:3px solid transparent;cursor:pointer}
.dot.on{background:#fff;border-color:#3b4cca;transform:scale(1.15)}
@media (max-width:600px){.arrow{position:absolute;top:calc(50% - 160px)}#goLeft{left:2px}#goRight{right:2px}.sign{max-width:calc(100% - 120px);font-size:22px;padding:6px 10px}}
</style>
<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b4cca">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="משחקי עומר">
<script src="pwa.js" defer></script>
<script src="shared/juice.js"></script>
<script src="shared/parental.js" defer></script>
<!-- /PWA -->
</head>
<body>
<h1><span id="heroP"></span>חנות המשחקים של עומר</h1>
<div class="topbar"><button class="chip" id="albumBtn" aria-label="אלבום המדבקות">📒 <span id="stkN">0</span></button><span class="chip stars">⭐ <span id="starN">0</span></span></div>
<div data-pwa-slot style="margin:0 0 4px"></div>
<div class="store" dir="ltr">
  <button class="arrow" id="goLeft" aria-label="מדף משמאל">◀</button>
  <div class="view" id="view"><div class="track" id="track"></div></div>
  <button class="arrow" id="goRight" aria-label="מדף מימין">▶</button>
</div>
<div class="dots" id="dots"></div>
<script>
/* SHELVES: ordered visually left -> right. The middle one is the front shelf shown first.
   To add a game: put {href, emoji, name, color} into a shelf's games (max ~4 per shelf),
   or add a new shelf object. */
const SHELVES = [
  {icon:'🧠', title:'חשיבה וחשבון', games:[
    {href:'brain/index.html', emoji:'🧠', name:'חדר כושר למוח', color:'#ff5252,#ff9100'},
    {href:'gifted/index.html', emoji:'🎓', name:'אתגר החשיבה', color:'#ab47bc,#ec407a'},
  ]},
  {icon:'⚡', title:"פיקאצ'ו וחברים", games:[
    {href:'pikachu/index.html', emoji:'⚡', name:"פיקאצ'ו תופס כדורים", color:'#ff5252,#ff9100'},
    {href:'garden/index.html', emoji:'🌸', name:"הגינה של פיקאצ'ו", color:'#29b6f6,#3949ab'},
    {href:'memory/index.html', emoji:'🃏', name:"משחק הזיכרון", color:'#66bb6a,#00897b'},
  ]},
  {icon:'🔬', title:'מדע', games:[
    {href:'science/index.html', emoji:'🔬', name:"המעבדה של פיקאצ'ו", color:'#29b6f6,#3949ab'},
  ]},
];
const track=document.getElementById('track'),dots=document.getElementById('dots');
const say=t=>OJ.say(t);
heroP.innerHTML=OJ.pika('happy',56);
heroP.onclick=()=>{OJ.sfx('pop');heroP.innerHTML=OJ.pika('cheer',56);OJ.sparkle(heroP,{n:10});say('היי עומר! בוא נשחק');setTimeout(()=>heroP.innerHTML=OJ.pika('happy',56),1500)};
function refreshTop(){stkN.textContent=OJ.stickerCount()+'/'+OJ.STICKERS.length;starN.textContent=OJ.totalStars()}
refreshTop();addEventListener('pageshow',refreshTop);
albumBtn.onclick=()=>{OJ.sfx('tap');OJ.album()};
if(!sessionStorage.getItem('greeted')){sessionStorage.setItem('greeted',1);setTimeout(()=>OJ.mascot('cheer','היי עומר! ⚡ מה נשחק היום?',{say:true,ms:3000,bottom:70}),700)}
SHELVES.forEach((s,i)=>{
  const el=document.createElement('section');el.className='shelf';el.dir='rtl';
  el.innerHTML='<div class="sign">'+s.icon+' '+s.title+'</div><div class="wood">'+s.games.map(g=>
    '<a class="box" draggable="false" href="'+g.href+'" style="background:linear-gradient(135deg,'+g.color+')"><div class="icon">'+g.emoji+'</div><div class="name">'+g.name+'</div><div class="gstars">⭐ '+OJ.totalStars(g.href.split('/')[0])+'</div></a>').join('')+'</div>';
  el.querySelector('.sign').onclick=()=>say('מדף '+s.title);
  track.appendChild(el);
  const d=document.createElement('span');d.className='dot';d.textContent=s.icon;d.onclick=()=>go(i);dots.appendChild(d);
});
// Say the game name, open it when the name has been fully spoken (max 3s; at once if speech/sound is off)
let opening=false;
track.addEventListener('click',e=>{const a=e.target.closest('a.box');if(!a)return;e.preventDefault();if(opening)return;opening=true;
  OJ.sfx('whoosh');OJ.bounce&&OJ.bounce(a);const href=a.getAttribute('href');let went=false;const open=()=>{if(went)return;went=true;location.href=href};
  if(!OJ.sfxOn||!window.speechSynthesis)return open();
  Promise.race([say(a.querySelector('.name').textContent),new Promise(r=>setTimeout(r,3000))]).then(()=>setTimeout(open,120))});
addEventListener('pageshow',()=>{opening=false});
let cur=+(sessionStorage.getItem('shelf')??Math.floor(SHELVES.length/2));
if(!(cur>=0&&cur<SHELVES.length))cur=Math.floor(SHELVES.length/2);
function go(i,speak=true){cur=Math.max(0,Math.min(SHELVES.length-1,i));sessionStorage.setItem('shelf',cur);
  track.style.transform='translateX('+(-cur*100)+'%)';
  [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===cur));
  goLeft.disabled=cur===0;goRight.disabled=cur===SHELVES.length-1;
  if(speak){OJ.sfx('whoosh');say('מדף '+SHELVES[cur].title)}}
goLeft.onclick=()=>go(cur-1);goRight.onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(cur-1);if(e.key==='ArrowRight')go(cur+1)});
let sx=null,sy=0;const view=document.getElementById('view');
view.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
view.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){go(dx<0?cur+1:cur-1);view.dataset.swiped=Date.now()}});
view.addEventListener('click',e=>{if(Date.now()-(+view.dataset.swiped||0)<300){e.preventDefault();e.stopPropagation()}},true);
go(cur,false);
</script>
</body>
</html>
